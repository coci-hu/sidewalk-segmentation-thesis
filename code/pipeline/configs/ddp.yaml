# ============================================================
# DDP 多卡训练配置
# 用法: torchrun --nproc_per_node=2 pipeline/train_main.py --config pipeline/configs/ddp.yaml
# ============================================================

data:
  dataset: cityscapes
  root_dir: ../dataset/cityscapes
  crop_size: [768, 1024]
  num_workers: 2            # 多卡时建议增加 worker
  pin_memory: true
  persistent_workers: true

model:
  name: bisenetv2_ca
  num_classes: 2
  pretrained: null
  freeze_backbone: false

train:
  epochs: 100
  batch_size: 4             # 每 GPU batch_size
  accum_steps: 1
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  t_max: 100
  eta_min: 0.000001
  ce_weight: 0.4
  dice_weight: 0.6
  grad_clip: 1.0            # 多卡训练建议开启梯度裁剪
  amp: false
  compile_model: false
  ddp: true                 # ★ 开启 DDP
  ddp_backend: nccl         # Linux 用 nccl，Windows 用 gloo

log:
  weight_dir: ../weights
  log_dir: ../train_logs
  csv_dir: ../train_logs
  experiment_name: bisenetv2_ca_ddp
  save_interval: 10
