# ENet-CBR 训练配置（本文核心方法 · ENet 版本）
# 启动（若 Trainer 已支持）：python pipeline/train_main.py --config pipeline/configs/enet_cbr.yaml
# 注意：本模型 forward 返回 (seg_out, bdy_loss) 元组，pipeline/trainer.py 暂不支持辅助边界损失，
#       因此实际训练使用的是独立脚本 code/train_enet_cbr.py（本 YAML 仅作超参记录与对照）。

data:
  dataset: cityscapes
  root_dir: ../dataset/cityscapes
  crop_size: [768, 1024]
  num_workers: 1
  pin_memory: true
  persistent_workers: false

model:
  name: enet_cbr
  num_classes: 2
  pretrained: null
  freeze_backbone: false
  boundary_weight: 0.5

train:
  epochs: 100
  batch_size: 4
  accum_steps: 1
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  t_max: 100
  eta_min: 0.000001
  ce_weight: 0.4
  dice_weight: 0.6
  grad_clip: 0.0
  amp: false
  compile_model: false
  ddp: false
  ddp_backend: nccl

log:
  weight_dir: ../weights
  log_dir: ../train_logs
  csv_dir: ../train_logs
  experiment_name: enet_cbr
  save_interval: 10
