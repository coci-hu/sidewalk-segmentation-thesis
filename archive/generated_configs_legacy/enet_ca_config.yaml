data:
  crop_size: !!python/tuple
  - 768
  - 1024
  dataset: cityscapes
  num_workers: 1
  persistent_workers: false
  pin_memory: true
  root_dir: ../dataset/cityscapes
log:
  csv_dir: ../train_logs
  experiment_name: enet_ca
  log_dir: ../train_logs
  save_interval: 10
  weight_dir: ../weights
model:
  freeze_backbone: false
  name: enet_ca
  num_classes: 2
  pretrained: null
train:
  accum_steps: 1
  amp: false
  batch_size: 4
  ce_weight: 0.4
  compile_model: false
  ddp: false
  ddp_backend: nccl
  dice_weight: 0.6
  epochs: 100
  eta_min: 1.0e-06
  grad_clip: 0.0
  lr: 0.0001
  optimizer: adamw
  scheduler: cosine
  t_max: 100
  weight_decay: 0.0001
